name: Go Lint

on: [push, pull_request]

jobs:
  test:
    name: Lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/checkout@v4
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          install-mode: goinstall
          version: latest
